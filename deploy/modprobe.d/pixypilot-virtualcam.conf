# v4l2loopback sink for PixyPilot virtual camera output.
# /dev/video10 is kept clear of the physical camera's /dev/video0-1.
# NOTE: keep_format/sustain_framerate are device ioctls on v4l2loopback
# >=0.13, not module params — passing them here makes modprobe fail.
# PixyPilot's standby feeder holds the sink's caps instead.
options v4l2loopback video_nr=10 card_label="PixyPilot Virtual" exclusive_caps=1
