[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixypilot-backend"
version = "0.1.0"
description = "Pixy Arch backend: local control deck for the EMEET PIXY camera"
requires-python = ">=3.12"
authors = [{ name = "Duan Krynen" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.2",
  "pyudev>=0.24.0",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.urls]
Homepage = "https://github.com/Dkrynen/pixy-arch"
Issues = "https://github.com/Dkrynen/pixy-arch/issues"

[project.scripts]
pixypilot-api = "pixypilot.run:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/pixypilot/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# Explicit so newer ruff releases don't silently widen the default rule set.
select = ["E4", "E7", "E9", "F"]
