name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: hardware
    attributes:
      label: Hardware findings
      description: If this needs a new camera command, include any packet captures or notes you have (describe them; don't attach captures that contain device serials).
